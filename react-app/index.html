<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events Showcase — Dev Sandbox</title>
  </head>
  <body>
    <!--
      Standalone dev sandbox only. On the real WordPress site this whole
      block — wrapper, inline payload, mount div, data-* attributes — is
      rendered by the shortcode's PHP template instead; see
      wordpress-plugin/events-showcase/includes/class-shortcode.php.

      The sample payload below stands in for the SSR JSON the shortcode
      normally inlines, so `npm run dev` shows real cards without a live
      WordPress backend. Filter/search changes still try to hit
      /wp-json/events-showcase/v1 and will fail here with no backend
      running — that's expected; this sandbox is for the initial render,
      not full integration testing.
    -->
    <div class="events-showcase-root">
      <script type="application/json" id="es-events-data-dev">
        {
          "events": [
            {
              "id": 1,
              "title": "Summer Dev Conference",
              "permalink": "#",
              "excerpt": "A day of talks on modern web tooling.",
              "content": "<p>Full description of the summer developer conference goes here.</p>",
              "start_datetime": "2026-07-14T09:00:00+00:00",
              "end_datetime": "2026-07-14T17:00:00+00:00",
              "venue": "Main Hall",
              "location": "Colombo",
              "categories": [{ "slug": "conference", "name": "Conference" }],
              "thumbnail": { "url": "https://placehold.co/600x400", "width": 600, "height": 400, "alt": "" },
              "external_url": null
            },
            {
              "id": 2,
              "title": "React Meetup #12",
              "permalink": "#",
              "excerpt": "Monthly meetup for local React developers.",
              "content": "<p>Full description of the meetup goes here.</p>",
              "start_datetime": "2026-08-02T18:30:00+00:00",
              "end_datetime": null,
              "venue": "Innovation Hub",
              "location": "Kandy",
              "categories": [{ "slug": "meetup", "name": "Meetup" }],
              "thumbnail": { "url": "https://placehold.co/600x400", "width": 600, "height": 400, "alt": "" },
              "external_url": null
            }
          ],
          "total": 2,
          "pages": 1
        }
      </script>
      <div
        data-events-showcase
        data-payload="es-events-data-dev"
        data-api="/wp-json/events-showcase/v1"
        data-per-page="12"
        data-category=""
        data-search=""
        data-nonce=""
      ></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
